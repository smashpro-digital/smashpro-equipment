<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" role="img" aria-labelledby="t d">
  <title id="t">SP-LiveVest 01 concept illustration</title>
  <desc id="d">Schematic concept of a high-visibility vest with reflective bands, pockets and a reinforced chest camera panel. Not a product render.</desc>
  <rect width="600" height="720" fill="#07090a"/>
  <g fill="none" stroke="#2b352e" stroke-width="1">
    <path d="M0 120H600M0 240H600M0 360H600M0 480H600M0 600H600M120 0V720M240 0V720M360 0V720M480 0V720"/>
  </g>
  <!-- vest body -->
  <path d="M190 110 L250 90 Q300 150 350 90 L410 110 L470 210 L455 640 Q300 670 145 640 L130 210 Z" fill="#2fd572" stroke="#0b0f0c" stroke-width="6"/>
  <path d="M250 90 Q300 150 350 90 L340 200 L300 230 L260 200 Z" fill="#07090a"/>
  <!-- reflective bands -->
  <rect x="138" y="430" width="324" height="26" fill="#d9e2dc"/>
  <rect x="142" y="520" width="316" height="26" fill="#d9e2dc"/>
  <rect x="200" y="118" width="22" height="300" fill="#d9e2dc" transform="rotate(-6 211 268)"/>
  <rect x="378" y="118" width="22" height="300" fill="#d9e2dc" transform="rotate(6 389 268)"/>
  <!-- purple trim -->
  <path d="M300 230 V640" stroke="#9b5cff" stroke-width="8"/>
  <!-- pockets -->
  <rect x="170" y="575" width="100" height="55" rx="6" fill="#26b862" stroke="#0b0f0c" stroke-width="4"/>
  <rect x="330" y="575" width="100" height="55" rx="6" fill="#26b862" stroke="#0b0f0c" stroke-width="4"/>
  <rect x="165" y="300" width="70" height="90" rx="6" fill="#26b862" stroke="#0b0f0c" stroke-width="4"/>
  <!-- camera panel + camera -->
  <rect x="320" y="255" width="110" height="140" rx="10" fill="#111" stroke="#9b5cff" stroke-width="5" stroke-dasharray="10 6"/>
  <rect x="342" y="275" width="66" height="96" rx="8" fill="#1b1f22" stroke="#39ff88" stroke-width="3"/>
  <circle cx="375" cy="308" r="18" fill="#050607" stroke="#39ff88" stroke-width="3"/>
  <circle cx="375" cy="350" r="5" fill="#ff4d5f"/>
  <!-- callout -->
  <path d="M430 300 H520" stroke="#9b5cff" stroke-width="2"/>
  <text x="440" y="290" fill="#d7c2ff" font-family="Arial, sans-serif" font-size="13" font-weight="700">CAMERA PANEL</text>
  <!-- label -->
  <rect x="24" y="24" width="250" height="34" fill="#9b5cff"/>
  <text x="38" y="47" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2">CONCEPT ILLUSTRATION</text>
  <text x="24" y="696" fill="#a8b2aa" font-family="Arial, sans-serif" font-size="13">SP-LiveVest 01 · Not a product render · Not for sale</text>
</svg>
