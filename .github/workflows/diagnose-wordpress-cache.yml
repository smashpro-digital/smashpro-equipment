name: Diagnose WordPress Production Cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-wordpress-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    name: Inspect production cache layout
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: List cache and plugin directories over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        shell: python
        run: |
          import ftplib, os
          host=os.environ['FTP_SERVER']; user=os.environ['FTP_USERNAME']; password=os.environ['FTP_PASSWORD']; port=int(os.environ['FTP_PORT'])
          ftp=ftplib.FTP(); ftp.connect(host, port, timeout=20); ftp.login(user,password)
          roots=[
            '/public_html/smashpro.app/wp-content/cache',
            '/public_html/smashpro.app/wp-content/plugins',
            '/public_html/smashpro.app/wp-content/mu-plugins',
          ]
          for root in roots:
              print(f'--- {root} ---')
              try:
                  ftp.cwd(root)
                  for name in ftp.nlst():
                      print(name.rsplit('/',1)[-1])
              except Exception as exc:
                  print(f'UNAVAILABLE: {type(exc).__name__}: {exc}')
          ftp.quit()

  report:
    name: Record cache diagnosis outcome
    if: always()
    needs: [diagnose]
    runs-on: ubuntu-latest
    steps:
      - name: Write cache diagnosis marker
        uses: actions/github-script@v7
        env:
          DIAGNOSE_RESULT: ${{ needs.diagnose.result }}
        with:
          script: |
            const path = 'docs/deployments/latest-cache-diagnosis.json';
            const branch = context.ref.replace('refs/heads/', '');
            const payload = {
              workflow: 'Diagnose WordPress Production Cache',
              run_id: context.runId,
              source_sha: context.sha,
              branch,
              diagnosis: process.env.DIAGNOSE_RESULT,
              completed_at: new Date().toISOString(),
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            };
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: branch });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `chore(cache): record diagnosis ${context.runId}`,
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64'),
              ...(existingSha ? { sha: existingSha } : {})
            });
