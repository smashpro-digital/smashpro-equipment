name: Add Rebirth Vision Block

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-rebirth-vision-block.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add concept rendering block
        shell: python
        run: |
          from pathlib import Path
          p = Path('deploy/smashpro-theme/page-media.php')
          s = p.read_text()
          if 'rebirth-vision-front.webp' not in s:
              css_marker = '.sp-media-rebirth__partner{'
              vision_css = '.sp-media-rebirth__vision{margin-top:clamp(2rem,5vw,3.5rem)}.sp-media-rebirth__vision-head{max-width:52rem;margin-bottom:1rem}.sp-media-rebirth__vision-head h3{margin:.25rem 0 .55rem;font-size:clamp(1.7rem,3vw,2.5rem)}.sp-media-rebirth__vision-head p{margin:0;color:var(--sp-color-text-muted)}.sp-media-rebirth__vision-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-space-4)}.sp-media-rebirth__vision-card{margin:0;overflow:hidden;border:1px solid rgba(34,197,94,.28);border-radius:var(--sp-radius-lg);background:rgba(255,255,255,.025);box-shadow:var(--sp-shadow-lg)}.sp-media-rebirth__vision-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.sp-media-rebirth__vision-copy{padding:1rem 1.1rem 1.2rem}.sp-media-rebirth__vision-label{display:inline-block;margin-bottom:.55rem;color:var(--sp-color-primary);font-size:.76rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.sp-media-rebirth__vision-copy strong{display:block;color:#fff}.sp-media-rebirth__vision-copy p{margin:.45rem 0 0;color:var(--sp-color-text-muted);font-size:.9rem;line-height:1.55}'
              s = s.replace(css_marker, vision_css + css_marker, 1)
              s = s.replace('@media(max-width:44rem){', '@media(max-width:50rem){.sp-media-rebirth__vision-grid{grid-template-columns:1fr}}@media(max-width:44rem){', 1)
              marker = '\t\t\t<div class="sp-media-rebirth__partner">'
              block = '''\t\t\t<div class="sp-media-rebirth__vision" aria-labelledby="rebirth-vision-title">\n\t\t\t\t<div class="sp-media-rebirth__vision-head"><p class="sp-eyebrow"><?php esc_html_e( 'Rebirth vision', 'smashpro' ); ?></p><h3 id="rebirth-vision-title"><?php esc_html_e( 'Where the build is headed.', 'smashpro' ); ?></h3><p><?php esc_html_e( 'These early concept renderings explore an approximately 6-inch lift direction, large-diameter wheels, and an aggressive tire stance. Final suspension, wheel dimensions, offset, and tire size remain subject to fitment and engineering review.', 'smashpro' ); ?></p></div>\n\t\t\t\t<div class="sp-media-rebirth__vision-grid">\n\t\t\t\t\t<figure class="sp-media-rebirth__vision-card"><img src="<?php echo esc_url( get_template_directory_uri() . '/assets/images/media/rebirth-vision-front.webp' ); ?>" alt="<?php esc_attr_e( 'Concept rendering of the Project Rebirth F-150 from the front three-quarter view with an approximately six-inch lifted stance and large wheels.', 'smashpro' ); ?>" loading="lazy"><figcaption class="sp-media-rebirth__vision-copy"><span class="sp-media-rebirth__vision-label"><?php esc_html_e( 'Concept rendering · final fitment TBD', 'smashpro' ); ?></span><strong><?php esc_html_e( 'Front three-quarter direction', 'smashpro' ); ?></strong><p><?php esc_html_e( 'Visual target only. The final package will be selected around verified 2WD suspension geometry, clearance, road manners, towing and work use.', 'smashpro' ); ?></p></figcaption></figure>\n\t\t\t\t\t<figure class="sp-media-rebirth__vision-card"><img src="<?php echo esc_url( get_template_directory_uri() . '/assets/images/media/rebirth-vision-rear.webp' ); ?>" alt="<?php esc_attr_e( 'Concept rendering of the Project Rebirth F-150 from the rear three-quarter view with an approximately six-inch lifted stance and large wheels.', 'smashpro' ); ?>" loading="lazy"><figcaption class="sp-media-rebirth__vision-copy"><span class="sp-media-rebirth__vision-label"><?php esc_html_e( 'Concept rendering · final fitment TBD', 'smashpro' ); ?></span><strong><?php esc_html_e( 'Rear three-quarter direction', 'smashpro' ); ?></strong><p><?php esc_html_e( 'The intent is an aggressive finished stance without presenting the rendering as a locked wheel, tire, offset, or suspension specification.', 'smashpro' ); ?></p></figcaption></figure>\n\t\t\t\t</div>\n\t\t\t</div>\n'''
              if marker not in s:
                  raise SystemExit('partner marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          php -l deploy/smashpro-theme/page-media.php
          grep -Fq 'rebirth-vision-front.webp' deploy/smashpro-theme/page-media.php
          grep -Fq 'rebirth-vision-rear.webp' deploy/smashpro-theme/page-media.php
          grep -Fq 'Where the build is headed.' deploy/smashpro-theme/page-media.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/smashpro-theme/page-media.php
          git rm -f .github/workflows/add-rebirth-vision-block.yml
          git commit -m "feat(media): show Rebirth concept vision"
          git push origin HEAD:main
