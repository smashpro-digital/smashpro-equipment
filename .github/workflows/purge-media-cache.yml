name: Purge SmashPro Media Cache

on:
  push:
    branches: [main]
    paths:
      - "deploy/smashpro-theme/page-media.php"
      - "deploy/smashpro-theme/assets/css/media.css"
      - "deploy/smashpro-theme/assets/images/media/**"
      - ".github/workflows/purge-media-cache.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    name: Purge and warm media cache
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://smashpro.app/media/#rebirth
    steps:
      - name: Delete only cached media page files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        shell: python
        run: |
          import ftplib, os
          host=os.environ['FTP_SERVER']; user=os.environ['FTP_USERNAME']; password=os.environ['FTP_PASSWORD']; port=int(os.environ['FTP_PORT'])
          ftp=ftplib.FTP(); ftp.connect(host, port, timeout=20); ftp.login(user,password)
          root='/public_html/smashpro.app/wp-content/cache/page_enhanced/smashpro.app/media'
          ftp.cwd(root)
          targets=['_index_slash_ssl.html','_index_slash_ssl.html_gzip']
          for target in targets:
              try:
                  ftp.delete(target)
                  print(f'deleted {target}')
              except ftplib.error_perm as exc:
                  if str(exc).startswith('550'):
                      print(f'already absent {target}')
                  else:
                      raise
          ftp.quit()

      - name: Warm and verify Rebirth media URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 \
            'https://smashpro.app/media/' --output /tmp/media-warm.html
          grep -Fq 'SmashPro Media + Partnerships' /tmp/media-warm.html
          grep -Fq 'Project Rebirth' /tmp/media-warm.html
          grep -Fq 'From working truck to Rebirth.' /tmp/media-warm.html
          grep -Fq 'rebirth-work-haul.webp' /tmp/media-warm.html
          grep -Fq 'rebirth-tire-evolution.webp' /tmp/media-warm.html
          grep -Fq 'rebirth-trailer-use.webp' /tmp/media-warm.html

          sleep 3
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 \
            --dump-header /tmp/media-normal.headers \
            'https://smashpro.app/media/' --output /tmp/media-normal.html
          grep -Fq 'id="rebirth"' /tmp/media-normal.html
          grep -Fq 'From working truck to Rebirth.' /tmp/media-normal.html
          grep -Fq 'Real work' /tmp/media-normal.html
          grep -Fq 'Build history' /tmp/media-normal.html
          grep -Fq 'Towing + utility' /tmp/media-normal.html
          echo '--- normal response cache headers after purge ---'
          grep -Ei '^(cache-control|age|etag|last-modified|server|x-cache|cf-cache-status|x-litespeed-cache):' /tmp/media-normal.headers || true

  report:
    name: Record media cache purge outcome
    if: always()
    needs: [purge]
    runs-on: ubuntu-latest
    steps:
      - name: Write cache purge marker
        uses: actions/github-script@v7
        env:
          PURGE_RESULT: ${{ needs.purge.result }}
        with:
          script: |
            const path = 'docs/deployments/latest-media-cache-purge.json';
            const branch = context.ref.replace('refs/heads/', '');
            const payload = {
              workflow: 'Purge SmashPro Media Cache',
              run_id: context.runId,
              source_sha: context.sha,
              branch,
              purge: process.env.PURGE_RESULT,
              production_url: 'https://smashpro.app/media/#rebirth',
              completed_at: new Date().toISOString(),
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            };
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: branch });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `chore(cache): record media purge ${context.runId}`,
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64'),
              ...(existingSha ? { sha: existingSha } : {})
            });
