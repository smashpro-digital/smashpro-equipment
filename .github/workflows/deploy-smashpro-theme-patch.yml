name: Deploy SmashPro Intake Theme Patch

on:
  push:
    branches: [main]
    paths:
      - "deploy/smashpro-theme/**"
      - ".github/workflows/deploy-smashpro-theme-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-smashpro-intake-theme-patch
  cancel-in-progress: false

jobs:
  validate:
    name: Validate theme patch
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Validate staged JavaScript
        run: node --check deploy/smashpro-theme/assets/js/intake-preselection.js

      - name: Lint staged PHP
        run: php -l deploy/smashpro-theme/inc/setup.php

      - name: Verify approved behavior and files
        shell: bash
        run: |
          set -euo pipefail
          test -f deploy/smashpro-theme/assets/css/intake-preselection.css
          grep -Fq 'Estimate for ${label}' deploy/smashpro-theme/assets/js/intake-preselection.js
          grep -Fq 'Change service' deploy/smashpro-theme/assets/js/intake-preselection.js
          grep -Fq 'smashpro-intake-preselection' deploy/smashpro-theme/inc/setup.php
          grep -Fq 'sp-intake-selection--context' deploy/smashpro-theme/assets/css/intake-preselection.css

      - name: Upload validated theme patch
        uses: actions/upload-artifact@v4
        with:
          name: smashpro-intake-theme-patch
          path: deploy/smashpro-theme/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish theme patch to production
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://smashpro.app/book/
    steps:
      - name: Download validated theme patch
        uses: actions/download-artifact@v4
        with:
          name: smashpro-intake-theme-patch
          path: theme-patch

      - name: Verify required deployment settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PORT; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deployment secret::GitHub secret $name is required for the approved theme patch."
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy patch incrementally without remote cleanup
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./theme-patch/
          server-dir: /public_html/smashpro.app/wp-content/themes/smashpro/
          state-name: .ftp-deploy-intake-preselection-patch-v1.json
          dangerous-clean-slate: false

      - name: Verify production assets and booking route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            https://smashpro.app/wp-content/themes/smashpro/assets/js/intake-preselection.js \
            | grep -Fq 'Estimate for ${label}'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            https://smashpro.app/wp-content/themes/smashpro/assets/css/intake-preselection.css \
            | grep -Fq 'sp-intake-selection--context'
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            'https://smashpro.app/book/?equipment_required=SP-ARDHI-26&equipment_source=SP-ARDHI-26&service=driveway-gravel-refresh' \
            | grep -Fq 'intake-preselection.js'

  report:
    name: Record patch deployment outcome
    if: always()
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Write deployment status marker
        uses: actions/github-script@v7
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const path = 'docs/deployments/latest-smashpro-theme-patch.json';
            const branch = context.ref.replace('refs/heads/', '');
            const payload = {
              workflow: 'Deploy SmashPro Intake Theme Patch',
              run_id: context.runId,
              run_number: context.runNumber,
              source_sha: context.sha,
              branch,
              validation: process.env.VALIDATE_RESULT,
              deployment: process.env.DEPLOY_RESULT,
              production_url: 'https://smashpro.app/book/',
              completed_at: new Date().toISOString(),
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            };
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `chore(deploy): record SmashPro theme patch ${context.runId}`,
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64'),
              ...(existingSha ? { sha: existingSha } : {})
            });
