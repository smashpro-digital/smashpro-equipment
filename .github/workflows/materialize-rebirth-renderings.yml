name: Materialize Rebirth Renderings

on:
  push:
    branches: [main]
    paths:
      - "tmp/rebirth-vision-front280.b64"
      - "tmp/rebirth-vision-rear320.b64"
      - ".github/workflows/materialize-rebirth-renderings.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode renderings into theme assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/smashpro-theme/assets/images/media
          base64 -d tmp/rebirth-vision-front280.b64 > deploy/smashpro-theme/assets/images/media/rebirth-vision-front.webp
          base64 -d tmp/rebirth-vision-rear320.b64 > deploy/smashpro-theme/assets/images/media/rebirth-vision-rear.webp
          file deploy/smashpro-theme/assets/images/media/rebirth-vision-front.webp
          file deploy/smashpro-theme/assets/images/media/rebirth-vision-rear.webp
          test -s deploy/smashpro-theme/assets/images/media/rebirth-vision-front.webp
          test -s deploy/smashpro-theme/assets/images/media/rebirth-vision-rear.webp
      - name: Commit binary assets and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/smashpro-theme/assets/images/media/rebirth-vision-front.webp deploy/smashpro-theme/assets/images/media/rebirth-vision-rear.webp
          git rm -f tmp/rebirth-vision-front280.b64 tmp/rebirth-vision-rear320.b64 || true
          git rm -f tmp/rebirth-vision-front.b64 tmp/rebirth-front.part1 || true
          git rm -f .github/workflows/materialize-rebirth-renderings.yml
          git commit -m "feat(media): add Rebirth concept renderings"
          git push origin HEAD:main
