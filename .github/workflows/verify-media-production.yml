name: Verify SmashPro Media Production

on:
  push:
    branches: [main]
    paths:
      - "deploy/smashpro-theme/page-media.php"
      - "deploy/smashpro-theme/assets/css/media.css"
      - "deploy/smashpro-theme/assets/images/media/**"
      - ".github/workflows/verify-media-production.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify live media partnership hub
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed media stylesheet
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 \
            --header 'Cache-Control: no-cache' \
            "https://smashpro.app/wp-content/themes/smashpro/assets/css/media.css?deploy_check=${stamp}" \
            --output /tmp/media.css
          grep -Fq '.sp-media-rebirth' /tmp/media.css
          grep -Fq '.sp-media-rebirth__gallery' /tmp/media.css
          grep -Fq '.sp-media-rebirth__timeline' /tmp/media.css

      - name: Verify Rebirth media assets
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          for asset in rebirth-work-haul.webp rebirth-tire-evolution.webp rebirth-trailer-use.webp; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 5 \
              --header 'Cache-Control: no-cache' \
              "https://smashpro.app/wp-content/themes/smashpro/assets/images/media/${asset}?deploy_check=${stamp}" \
              --output "/tmp/${asset}"
            test -s "/tmp/${asset}"
          done

      - name: Verify live Rebirth dossier
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date +%s)

          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 \
            --dump-header /tmp/media-normal.headers \
            'https://smashpro.app/media/' \
            --output /tmp/media-normal.html

          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 \
            --header 'Cache-Control: no-cache' \
            --header 'Pragma: no-cache' \
            --dump-header /tmp/media-busted.headers \
            "https://smashpro.app/media/?deploy_check=${stamp}" \
            --output /tmp/media-busted.html

          echo '--- normal response cache headers ---'
          grep -Ei '^(cache-control|age|etag|last-modified|server|x-cache|cf-cache-status|x-litespeed-cache):' /tmp/media-normal.headers || true
          echo '--- cache-busted response cache headers ---'
          grep -Ei '^(cache-control|age|etag|last-modified|server|x-cache|cf-cache-status|x-litespeed-cache):' /tmp/media-busted.headers || true

          for page in /tmp/media-normal.html /tmp/media-busted.html; do
            grep -Fq 'SmashPro Media + Partnerships' "$page"
            grep -Fq 'id="rebirth"' "$page"
            grep -Fq 'From working truck to Rebirth.' "$page"
            grep -Fq 'rebirth-work-haul.webp' "$page"
            grep -Fq 'rebirth-tire-evolution.webp' "$page"
            grep -Fq 'rebirth-trailer-use.webp' "$page"
            grep -Fq 'Watch Rebirth Episode 1' "$page"
          done

  report:
    name: Record media verification outcome
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Write verification status marker
        uses: actions/github-script@v7
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const path = 'docs/deployments/latest-media-verification.json';
            const branch = context.ref.replace('refs/heads/', '');
            const payload = {
              workflow: 'Verify SmashPro Media Production',
              run_id: context.runId,
              run_number: context.runNumber,
              source_sha: context.sha,
              branch,
              verification: process.env.VERIFY_RESULT,
              production_url: 'https://smashpro.app/media/#rebirth',
              completed_at: new Date().toISOString(),
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            };
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              message: `chore(verify): record media verification ${context.runId}`,
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64'),
              ...(existingSha ? { sha: existingSha } : {})
            });
