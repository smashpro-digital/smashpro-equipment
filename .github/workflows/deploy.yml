name: Build and Deploy Equipment Showroom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-equipment-showroom
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out showroom source
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build static showroom
        run: npm run build
      - name: Validate customer-safe Equipment Passport index
        run: npm run validate:index
      - name: Verify protected build outputs
        run: |
          missing=0
          for path in dist/index.html dist/sp-ardhi-26.html dist/sp-mzigo-26.html dist/catalog/index.html dist/catalog/sp-pcm-001/index.html dist/documents/catalog/sp-pcm-001/rev-a/nameplates/sp-pcm-001-2018-f150-custom-battery-box-plate-rev-a.pdf dist/documents/catalog/sp-pcm-001/rev-a/nameplates/sp-pcm-001-2018-f150-custom-battery-box-plate-rev-a.png dist/documents/catalog/sp-pcm-001/rev-a/nameplates/sp-pcm-001-2018-f150-custom-battery-box-plate-rev-a.svg dist/equipment-index.json dist/images/sp-pcm-001-design-poster.png dist/images/sp-pcm-001-detail-closeup.png dist/images/sp-pcm-001-project-rebirth-prototype.jpg dist/images/sp-pcm-001/sp-pcm-001-engine-bay-prototype.jpg dist/images/sp-pcm-001/sp-pcm-001-cardboard-enclosure-fitment.jpg dist/images/sp-pcm-001/sp-pcm-001-terminal-clearance-prototype.jpg dist/images/sp-pcm-001/sp-pcm-001-ml-rbs-fitment.jpg dist/images/sp-pcm-001/sp-pcm-001-remote-switch-control.jpg dist/images/sp-gari-26e-concept.png dist/images/sp-ardhi-26-hero.png dist/images/sp-mzigo-26e-hero.png dist/images/sp-ardhi-26-pallet-fork-test.mp4 dist/images/sp-ardhi-26-shipping-2026-08-21-01.png dist/images/sp-ardhi-26-shipping-2026-08-21-02.png dist/images/sp-ardhi-26-shipping-2026-08-21-03.png; do
            if [ ! -f "$path" ]; then
              echo "::error title=Missing build output::$path was not generated."
              missing=1
            fi
          done
          video_size=$(wc -c < dist/images/sp-ardhi-26-pallet-fork-test.mp4)
          if [ "$video_size" -lt 1000000 ]; then
            echo "::error title=Invalid video artifact::Pallet fork video is only $video_size bytes; Git LFS content was not resolved."
            missing=1
          fi
          exit "$missing"
      - name: Upload validated showroom artifact
        uses: actions/upload-artifact@v4
        with:
          name: equipment-showroom-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy static showroom to production
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://smashpro.app/equipment/
    steps:
      - name: Download validated showroom artifact
        uses: actions/download-artifact@v4
        with:
          name: equipment-showroom-dist
          path: dist
      - name: Verify required deployment settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment secret::GitHub secret $name is required for the equipment showroom deployment."
              missing=1
            fi
          done
          exit "$missing"
      - name: Deploy generated output incrementally
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /public_html/smashpro.app/equipment/
          state-name: .ftp-deploy-sync-state-v2.json
          dangerous-clean-slate: false
